name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build Release
        run: |
          xcodebuild \
            -project MDE/MDE.xcodeproj \
            -scheme MDE \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=

      - name: Zip the .app bundle
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent MDE.app "$GITHUB_WORKSPACE/MDE-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: MDE-*.zip
          generate_release_notes: true
