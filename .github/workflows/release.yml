name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # Builds with SwiftPM + build.sh — the same path a colleague uses with
      # only the Command Line Tools. No Xcode project / xcodebuild involved.
      - name: Build Release
        run: bash build.sh

      - name: Zip the .app bundle
        run: ditto -c -k --keepParent build/MDE.app "MDE-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: MDE-*.zip
          generate_release_notes: true
